name: validate-skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate skills and shared references
        run: |
          python scripts/build.py --check
          python scripts/validate_skills.py

      - name: Install supported CLI into isolated prefix
        run: |
          npm install --prefix "$RUNNER_TEMP/meshy-cli" meshy-cli@0.3.0 --no-audit --no-fund
          echo "MESHY_CLI_BIN=$RUNNER_TEMP/meshy-cli/node_modules/meshy-cli/dist/index.js" >> "$GITHUB_ENV"

      # Covers auth, runner, generation and printing contracts. The runner test runs the
      # documented `npm exec --package=meshy-cli@0.3.0` entry point, so it reaches the npm
      # registry; every API call in the suite stays on loopback with synthetic credentials.
      - name: Isolated CLI contract tests (no live API)
        run: node --test tests/*.test.mjs
